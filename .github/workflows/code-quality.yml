name: code-quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: install editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@d2ed4fd072ae6f887e9407c909af0f585d2ad9f4  # v2
        with:
          # v4.0.0 renamed its release assets from ec-* to
          # editorconfig-checker-*, which this action cannot find.
          version: v3.11.3

      # The action above only installs the binary and adds it to PATH. Without
      # this step nothing is ever checked.
      - name: editorconfig
        run: editorconfig-checker

      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7  # v2.2.0
        with:
          fail-on-error: true

      # FC-TS-016 - Biome is the linter and formatter for JS/TS. Pinned so the
      # same commit lints identically on any day (FC-GEN-059).
      - name: biome
        run: npx --yes @biomejs/biome@2.5.6 ci --files-ignore-unknown=true --no-errors-on-unmatched .
